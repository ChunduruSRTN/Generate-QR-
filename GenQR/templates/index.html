<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generator</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    form, .qr-list { margin-top: 20px; }
    .qr-card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>QR Code Generator</h1>

  <form method="POST">
    <input type="text" name="data" placeholder="Enter text or URL" required>
    <button type="submit">Generate</button>
  </form>

  <div class="qr-list">
    {% for item in data %}
      <div class="qr-card">
        <p><strong>Text:</strong> {{ item.content }}</p>
        <img src="{{ url_for('static', filename='qrcodes/' + item.filename) }}" width="150">
        <p><a href="{{ url_for('download_qr', filename=item.filename) }}">Download</a></p>
      </div>
    {% endfor %}
  </div>
</body>
</html>
